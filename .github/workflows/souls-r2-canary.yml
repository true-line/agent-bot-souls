name: Souls R2 canary
on:
  workflow_dispatch:
permissions: {}
jobs:
  ref_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse anything but protected main
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$REF_PROTECTED" != "true" ]]; then
            echo "::error::R2 canary requires protected refs/heads/main."
            exit 1
          fi
  canary:
    needs: ref_gate
    runs-on: ubuntu-24.04
    environment: qualification-release
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned R2 client in isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/stage2a-r2-venv"
          "$RUNNER_TEMP/stage2a-r2-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: --require-hashes \
            --requirement scripts/requirements-r2.txt
      - name: Prove scoped writer, independent reader and current lock enforcement
        env:
          R2_STAGE_WRITE_ACCESS_KEY_ID: ${{ secrets.R2_STAGE_WRITE_ACCESS_KEY_ID }}
          R2_STAGE_WRITE_SECRET_ACCESS_KEY: ${{ secrets.R2_STAGE_WRITE_SECRET_ACCESS_KEY }}
          R2_STAGE_READ_ACCESS_KEY_ID: ${{ secrets.R2_STAGE_READ_ACCESS_KEY_ID }}
          R2_STAGE_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_STAGE_READ_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          result="$RUNNER_TEMP/stage2a-canary-result.json"
          "$RUNNER_TEMP/stage2a-r2-venv/bin/python" scripts/r2-private-assets.py canary > "$result"
          python3 - "$result" <<'PY'
          import json, os, re, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              result = json.load(source)
          if (result.get("result") != "pass" or
                  not re.fullmatch(r"sha256:[0-9a-f]{64}", result.get("receipt_sha256", "")) or
                  result.get("lock_duration_verified_by_ci") is not False):
              raise SystemExit("R2 canary receipt summary is invalid")
          line = (f"R2 canary pass; run={os.environ['GITHUB_RUN_ID']}; "
                  f"source={os.environ['GITHUB_SHA']}; "
                  f"receipt={result['receipt_sha256']}; "
                  f"observed={result['observed_at_utc']}; "
                  "rule duration requires separate dashboard review")
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(line + "\n")
          PY
