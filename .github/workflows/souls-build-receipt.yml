# REVIEW DRAFT. Do not publish until the private R2 transport, protected
# credentials, public Statement and owner-pinned verifier are reviewed.
name: Souls build receipt
on:
  workflow_dispatch:
    inputs:
      lock_attestation_sha256:
        description: SHA-256 of reviewed private Cloudflare lock evidence
        required: true
        type: string
      lock_attested_at_utc:
        description: UTC time of owner-controlled lock read-back
        required: true
        type: string
permissions: {}
jobs:
  ref_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse anything but protected main
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$REF_PROTECTED" != "true" ]]; then
            echo "::error::Souls receipt signing requires protected refs/heads/main."
            exit 1
          fi
  build:
    needs: ref_gate
    runs-on: ubuntu-24.04
    environment: qualification-release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Block signing until canary, lock attestation and public Rekor review
        run: |
          echo "::error::Private R2 canary/read-back, owner-controlled lock attestation and real Statement/Rekor review are still held."
          exit 1
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.1
      - name: Select npm
        run: npm install --global npm@11.20.0 --ignore-scripts --no-audit --no-fund
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Prepare pinned contracts and test exact source
        run: |
          npm run prepare:contracts
          npm test
          python3 -m unittest -v scripts/test_record_souls_private_handoff.py
          python3 -m unittest -v scripts/test_check_souls_receipt_shape.py
      - name: Build exact archive and Statement
        id: build
        run: python3 scripts/build-souls-receipt.py
      - name: Install pinned R2 client in isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/stage2a-r2-venv"
          "$RUNNER_TEMP/stage2a-r2-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: --require-hashes \
            --requirement scripts/requirements-r2.txt
      - name: Store package once and verify through separate reader
        env:
          BUILD_DIR: ${{ steps.build.outputs.directory }}
          PACKAGE: ${{ steps.build.outputs.package }}
          PACKAGE_SHA256: ${{ steps.build.outputs.package_sha256 }}
          R2_STAGE_LOCK_ATTESTATION_SHA256: ${{ inputs.lock_attestation_sha256 }}
          R2_STAGE_LOCK_ATTESTED_AT_UTC: ${{ inputs.lock_attested_at_utc }}
          R2_STAGE_WRITE_ACCESS_KEY_ID: ${{ secrets.R2_STAGE_WRITE_ACCESS_KEY_ID }}
          R2_STAGE_WRITE_SECRET_ACCESS_KEY: ${{ secrets.R2_STAGE_WRITE_SECRET_ACCESS_KEY }}
          R2_STAGE_READ_ACCESS_KEY_ID: ${{ secrets.R2_STAGE_READ_ACCESS_KEY_ID }}
          R2_STAGE_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_STAGE_READ_SECRET_ACCESS_KEY }}
        run: |
          "$RUNNER_TEMP/stage2a-r2-venv/bin/python" scripts/r2-private-assets.py put \
            --role souls-package --file "$PACKAGE" --sha256 "sha256:$PACKAGE_SHA256" \
            > "$BUILD_DIR/package-store-receipt.json"
      - name: Sign exact Statement with Actions OIDC
        env:
          BUILD_DIR: ${{ steps.build.outputs.directory }}
        run: |
          cosign attest-blob --yes \
            --statement "$BUILD_DIR/statement.json" \
            --bundle "$BUILD_DIR/souls-build-receipt.bundle.json"
      - name: Name receipt by its exact byte digest
        id: receipt
        env:
          BUILD_DIR: ${{ steps.build.outputs.directory }}
        run: |
          digest="$(sha256sum "$BUILD_DIR/souls-build-receipt.bundle.json" | cut -d ' ' -f1)"
          target="$BUILD_DIR/sha256-$digest.sigstore.json"
          mv "$BUILD_DIR/souls-build-receipt.bundle.json" "$target"
          echo "bundle=$target" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Check bundle shape and exact archive claims
        env:
          BUILD_DIR: ${{ steps.build.outputs.directory }}
          BUNDLE: ${{ steps.receipt.outputs.bundle }}
          BUNDLE_SHA256: ${{ steps.receipt.outputs.bundle_sha256 }}
          PACKAGE: ${{ steps.build.outputs.package }}
        run: |
          python3 scripts/check-souls-receipt-shape.py \
            "$BUNDLE" \
            "$BUILD_DIR/build-inputs.json" \
            "$PACKAGE"
      - name: Store signed receipt once and verify through separate reader
        env:
          BUILD_DIR: ${{ steps.build.outputs.directory }}
          BUNDLE: ${{ steps.receipt.outputs.bundle }}
          BUNDLE_SHA256: ${{ steps.receipt.outputs.bundle_sha256 }}
          R2_STAGE_LOCK_ATTESTATION_SHA256: ${{ inputs.lock_attestation_sha256 }}
          R2_STAGE_LOCK_ATTESTED_AT_UTC: ${{ inputs.lock_attested_at_utc }}
          R2_STAGE_WRITE_ACCESS_KEY_ID: ${{ secrets.R2_STAGE_WRITE_ACCESS_KEY_ID }}
          R2_STAGE_WRITE_SECRET_ACCESS_KEY: ${{ secrets.R2_STAGE_WRITE_SECRET_ACCESS_KEY }}
          R2_STAGE_READ_ACCESS_KEY_ID: ${{ secrets.R2_STAGE_READ_ACCESS_KEY_ID }}
          R2_STAGE_READ_SECRET_ACCESS_KEY: ${{ secrets.R2_STAGE_READ_SECRET_ACCESS_KEY }}
        run: |
          "$RUNNER_TEMP/stage2a-r2-venv/bin/python" scripts/r2-private-assets.py put \
            --role souls-build-bundle --file "$BUNDLE" --sha256 "sha256:$BUNDLE_SHA256" \
            > "$BUILD_DIR/bundle-store-receipt.json"
      - name: Record nonsecret private object handoff
        env:
          BUILD_DIR: ${{ steps.build.outputs.directory }}
          PACKAGE: ${{ steps.build.outputs.package }}
          BUNDLE: ${{ steps.receipt.outputs.bundle }}
        run: python3 scripts/record-souls-private-handoff.py "$BUILD_DIR" "$PACKAGE" "$BUNDLE"
      - name: Hold for post-upload lock attestation and final trust review
        run: |
          echo "::error::Post-upload owner-controlled lock attestation, exact signed receipt, private read-back, trust root and public Rekor entry have not been approved for release."
          exit 1
