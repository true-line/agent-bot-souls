name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # No external actions: checkout is plain git, and the runner's preinstalled Node runs the tests.
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git fetch -q --no-tags --depth 1 origin "+${REF}:refs/ci/head"
          git checkout -q --detach refs/ci/head
      - name: test
        run: |
          node --version
          npm run prepare:contracts
          npm test
          python3 -m unittest -v scripts/test_record_souls_private_handoff.py
          python3 -m unittest -v scripts/test_check_souls_receipt_shape.py
  darwin-member-sandbox:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out the exact Souls revision
        run: |
          git init -q .
          git fetch -q --no-tags --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Exercise cooperative member launches through the macOS process sandbox
        run: |
          export TMPDIR="$(mktemp -d /private/tmp/souls.XXXXXXXX)"
          trap 'rm -rf "$TMPDIR"' EXIT
          chgrp "$(id -g)" "$TMPDIR"
          npm run prepare:contracts
          node --test tests/darwin-member-sandbox.test.mjs
